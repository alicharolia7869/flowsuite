version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flowsuite_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: flowsuite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowsuite"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowsuite_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: flowsuite_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/flowsuite?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: flowsuite_production_jwt_secret_key_2026
      JWT_REFRESH_SECRET: flowsuite_production_refresh_jwt_secret_key_2026
      STRIPE_SECRET_KEY: sk_test_mockKeyForFlowSuiteDemo12345
      STRIPE_WEBHOOK_SECRET: whsec_mockSecretForFlowSuiteDemo12345

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: flowsuite_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
